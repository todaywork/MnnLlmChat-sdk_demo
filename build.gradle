plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// IDEs may request wrapper from this module; keep generation at the build root.
tasks.register('wrapper') {
    group = 'build setup'
    description = 'Generates the shared Gradle wrapper in the root project.'
    dependsOn ':wrapper'
}

android {
    namespace 'com.alibaba.mnnllm.sdk_demo'
    compileSdk 35

    defaultConfig {
        applicationId "com.alibaba.mnnllm.sdk_demo"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation files("../on_device_ai/build/outputs/aar/on_device_ai-${findProperty('sdkAarVersion') ?: '1.0.17'}-release.aar")
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
